<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLS Conformance Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-left">
        <h1>HLS Conformance Tester</h1>
        <a href="./verifier/" class="header-link">Manifest Verifier</a>
      </div>
      <div class="header-right">
        <div class="test-counts">
          <span>Total: <span id="total-count">0</span></span>
          <span>Passed: <span id="passed-count">0</span></span>
          <span>Failed: <span id="failed-count">0</span></span>
          <span>Running: <span id="running-count">0</span></span>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="report-box custom-test-container hidden">
      <h3>Run a Custom Test</h3>
      <div class="custom-test-input-group">
        <label for="manifest-url">Manifest URL:</label>
        <input type="url" id="manifest-url" placeholder="https://example.com/manifest.m3u8">
      </div>
      <div class="custom-test-input-group">
        <label for="manifest-file">Or upload a file:</label>
        <input type="file" id="manifest-file" accept=".m3u8">
      </div>
      <button id="run-custom-test-btn" class="btn">Run Custom Test</button>
    </div>
    <details class="report-box">
      <summary>MediaSource.isTypeSupported()</summary>
      <grid-renderer id="mse-grid" title="MediaSource.isTypeSupported()"></grid-renderer>
    </details>
    <details class="report-box">
      <summary>video.canPlayType()</summary>
      <grid-renderer id="video-grid" title="video.canPlayType()"></grid-renderer>
    </details>
    <div class="report-box hls-report-header">
      <div class="hls-report-summary">
        <div class="test-name-header">
          <span>Test Name</span>
          <input type="search" id="test-filter" placeholder="Filter...">
        </div>
        <div class="run-column-header">
          <button id="run-all-tests-btn" class="btn" title="Run all tests for all players">Run All</button>
        </div>
        <div class="result-group">
          <span class="result-header run-player-btn" data-player="native" title="Click to run all Native tests">&#9654; Native</span>
          <span class="result-header run-player-btn" data-player="hls.js" title="Click to run all HLS.js tests">&#9654; HLS.js</span>
          <span class="result-header run-player-btn" data-player="shaka-player" title="Click to run all Shaka Player tests">&#9654; Shaka</span>
          <span class="result-header run-player-btn" data-player="video.js" title="Click to run all Video.js tests">&#9654; Video.js</span>
        </div>
      </div>
    </div>
    <div id="hls-reports-container"></div>
    <div id="player-container" style="display:none;"></div>
  </main>
  <footer>
    <p>HLS Conformance Tester</p>
  </footer>
  <script src="./components/GridRenderer.js" type="module"></script>
  <script src="main.js" type="module"></script>
</body>
</html>
